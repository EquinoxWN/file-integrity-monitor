name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Every action is pinned to a full commit SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: make setup lint
      - run: make test PYTEST_ARGS="--junitxml=.tmp/junit.xml"
      - name: Known-vulnerability audit
        run: make audit
      # Real inotify watches, symlinks, FIFOs and an unreadable directory, as a normal user.
      - name: Linux-only tests (pytest -m linux)
        run: make test-linux PYTEST_ARGS="--junitxml=.tmp/junit-linux.xml"
      - name: Demo with the inotify backend (annotation)
        run: |
          python scripts/demo.py --backend inotify | tee demo.txt
          echo "::notice title=fim demo (inotify, ubuntu-latest)::$(tail -n 1 demo.txt)"
      - name: Failed tests (annotations)
        if: failure()
        run: |
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for report in pathlib.Path(".tmp").glob("junit*.xml"):
              for case in ET.parse(report).iter("testcase"):
                  for bad in [*case.iter("failure"), *case.iter("error")]:
                      msg = " ".join((bad.get("message") or "").split())[:900]
                      print(f"::error title={case.get('name')}::{msg}")
          PY
